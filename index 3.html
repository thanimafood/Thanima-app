/* Layout: one narrow column, five-tab bottom bar, bottom sheets for every form. Built for a phone held in one hand at a shop counter. */
:root {

}

.loginbox .l2 { font-weight: 700; font-size: 14px; margin-top: 10px; }

/* ===== v12: branded look, hero, compact shop tiles, dashboard ===== */
:root { --gold: #E9A913; --gold-bg: #FFF4D6; --deep: #0F4D22; --deep-2: #2E8B3E; --lift: 0px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --gold: #F2B632; --gold-bg: #33290A; } }
:root[data-theme="dark"] { --gold: #F2B632; --gold-bg: #33290A; }
.wrap { padding-bottom: calc(96px + var(--lift, 0px)); }
.nav { bottom: var(--lift, 0px); }
.lifted .nav { margin-inline: 10px; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 6px 22px rgba(15, 77, 34, .22); }
.toast { bottom: calc(84px + var(--lift, 0px) + env(safe-area-inset-bottom, 0px)); }
.liftbtn { margin-left: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 30px; height: 26px; font-size: 14px; line-height: 1; color: var(--muted); }
.sync { display: flex; align-items: center; }

.page-title { letter-spacing: -.01em; }
.hero { background: linear-gradient(135deg, var(--deep) 0%, #17692A 55%, var(--deep-2) 100%); color: #fff; border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 8px 22px rgba(15, 77, 34, .28); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -36px; top: -36px; width: 130px; height: 130px; border-radius: 50%; background: rgba(242, 182, 50, .22); }
.hero-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; position: relative; z-index: 1; }
.hero-top span { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #CFE8D3; font-weight: 600; }
.hero-top b { font-size: 32px; font-weight: 700; line-height: 1.1; }
.hero-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; position: relative; z-index: 1; }
.hero-row > div { background: rgba(255, 255, 255, .12); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.hero-row small { display: block; font-size: 11px; color: #CFE8D3; }
.hero-row b { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.hero-net { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255, 255, 255, .35); position: relative; z-index: 1; }
.hero-net span { font-size: 13px; color: #fff; }
.hero-net i { font-style: normal; font-size: 11px; color: #CFE8D3; }
.hero-net b { font-size: 20px; color: #F9D56E; }
.hero-net.neg b { color: #FFB4B4; }
.ledger-strip > div { border-radius: 14px; }
.btn.primary { box-shadow: 0 2px 8px rgba(23, 105, 42, .25); }
.sec h2 { font-size: 16px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.sec h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--gold); display: inline-block; }
.wabtn { margin-top: 8px; border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--surface); }
.rblock { border-radius: 18px; box-shadow: 0 2px 10px rgba(20, 32, 28, .06); }

/* compact shop tiles */
.stile { padding: 0; border-radius: 14px; overflow: hidden; }
.tilebtn { width: 100%; background: none; border: 0; text-align: left; padding: 11px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 58px; }
.tmain { display: grid; gap: 4px; min-width: 0; }
.tname { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.tmoney { display: flex; flex-wrap: wrap; gap: 5px; }
.mchip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); }
.mchip.ok { background: var(--ok-bg); color: var(--ok); } .mchip.due { background: var(--due-bg); color: var(--due); } .mchip.owe { background: var(--owe-bg); color: var(--owe); }
.tside { display: flex; align-items: center; gap: 6px; flex: none; }
.chev { font-size: 22px; color: var(--muted); line-height: 1; }
.stile.st-sale .mchip, .stile.st-nobuy .mchip, .stile.st-none .mchip { background: var(--surface); }

/* shop sheet */
.ssum { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.srow { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 14px; }
.srow.ok { color: var(--ok); } .srow.ret { color: var(--ret); } .srow.due { color: var(--due); } .srow.owe { color: var(--owe); }
.srow.big { font-size: 17px; font-weight: 700; }
.sdiv { border-top: 1px dashed var(--line); margin: 6px 0; }
.slines { list-style: none; margin: 0 0 4px; padding: 0 0 4px; border-bottom: 1px dashed var(--line); }
.slines li { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 2px 0; }
.slines.ret { color: var(--ret); }
a.btn.wa { background: #1FA855; border-color: #1FA855; color: #fff; }
.nb-on { background: var(--nb); color: #fff; border-color: var(--nb); }
.askitems { display: flex; flex-wrap: wrap; gap: 6px; max-height: 110px; overflow: auto; }
a.btn.sent { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.photorow { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
#i_prev { width: 84px; height: 84px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; flex: none; text-align: center; }
#i_prev img, .ithumb { width: 100%; height: 100%; object-fit: cover; display: block; }
.ithumb { width: 52px; height: 52px; border-radius: 10px; flex: none; }
.pbtns { display: grid; gap: 8px; min-width: 0; }
.pbtns input[type=file] { max-width: 100%; font-size: 13px; }
.item-top { display: flex; gap: 10px; align-items: center; }

/* dashboard */
.hero.dash { margin-top: 4px; }
.icards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
.icard { border-radius: 14px; padding: 10px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.icard small { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
.icard b { font-size: 14px; overflow-wrap: anywhere; line-height: 1.3; }
.icard span { font-size: 12px; }
.icard.gold { background: var(--gold-bg); color: var(--due); } .icard.green { background: var(--ok-bg); color: var(--ok); } .icard.pink { background: var(--nb-bg); color: var(--nb); }
@media (max-width: 380px) { .icards { grid-template-columns: 1fr; } }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(20, 32, 28, .05); }
.dcard select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.cols { display: flex; align-items: flex-end; gap: 4px; }
.col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.cb { height: 130px; width: 100%; display: flex; align-items: flex-end; }
.cb i { display: block; width: 100%; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--deep-2), var(--accent)); opacity: .85; }
.col.best .cb i { background: linear-gradient(180deg, #F2B632, var(--gold)); opacity: 1; }
.cv { font-size: 10px; color: var(--muted); height: 14px; line-height: 14px; white-space: nowrap; }
.cl { font-size: 10px; color: var(--muted); }
.cols.dense { gap: 2px; } .cols.dense .cl { font-size: 8.5px; } .cols.dense .cb i { border-radius: 3px 3px 1px 1px; }
.hbs { display: grid; gap: 10px; }
.hbl { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.hbl span { min-width: 0; overflow-wrap: anywhere; }
.hbl em { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; margin-right: 6px; background: var(--ok-bg); color: var(--ok); }
.hb.low .hbl em { background: var(--nb-bg); color: var(--nb); }
.hbt { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.hbt i { display: block; height: 100%; border-radius: 999px; background: var(--accent); opacity: .75; }
.hb.best .hbt i { background: linear-gradient(90deg, var(--gold), #F2B632); opacity: 1; }
.hb.low .hbt i { background: var(--nb); opacity: 1; }
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.login form{width:100%;max-width:380px;display:grid;gap:12px}
.login input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px}
</style>

  function linesText(e) {

  }

  function entryRow(e, opt) {

  function expRow(x) {

      '<div class="ri-side"><div class="amt">' + fmt(x.amount) + '</div>' + delBtn('expenses', x.id) + '</div></li>';
  }

  /* ---------- today: route -> shops, colour-coded ---------- */
  function shopDay(shopId, d) {
    var o = { sale: 0, payment: 0, ret: 0, nobuy: null, n: 0, items: {}, rets: [] };
    S.entries.forEach(function (e) {
      if (e.shopId !== shopId || e.date !== d) return;
      var a = Number(e.amount) || 0;
      if (e.type === 'sale') { o.sale += a; o.n++; (e.lines || []).forEach(function (l) { o.items[l.i] = (o.items[l.i] || 0) + (Number(l.q) || 0); }); }
      else if (e.type === 'payment') { o.payment += a; o.n++; }
      else if (e.type === 'return') { o.ret += a; o.n++; (e.lines || []).forEach(function (l) { o.rets.push(l); }); }
      else if (e.type === 'nobuy') o.nobuy = e;
    });
    o.status = o.sale > 0 ? 'sale' : o.nobuy ? 'nobuy' : (o.payment > 0 || o.ret > 0) ? 'other' : 'none';
    return o;
  }
  function shopTile(sh, d) {
    var x = shopDay(sh.id, d), b = balanceOf(sh.id), future = d > todayStr(), st = x.status, sid = esc(sh.id);
    var cls = st === 'none' && future ? 'st-future' : 'st-' + st;
    var chip = st === 'sale' ? '<span class="chip ok">✓ Sale done</span>' : st === 'nobuy' ? '<span class="chip nobuy">Did not buy</span>' :
      st === 'other' ? '<span class="chip due">Cash / return only</span>' : future ? '<span class="chip">Yet to visit</span>' : '<span class="chip red">No entry</span>';
    var money = [];
    if (x.payment > 0) money.push('<span class="mchip ok">Paid ' + fmt(x.payment) + '</span>');
    if (b > 0) money.push('<span class="mchip due">Balance ' + fmt(b) + '</span>');
    else if (b < 0) money.push('<span class="mchip owe">Payable ' + fmt(b) + '</span>');
    return '<li class="stile ' + cls + '"><button class="tilebtn" data-act="shop-sheet" data-id="' + sid + '"><span class="tmain"><span class="tname">' + esc(sh.name) + '</span>' +
      (money.length ? '<span class="tmoney">' + money.join('') + '</span>' : '') + '</span><span class="tside">' + chip + '<span class="chev" aria-hidden="true">›</span></span></button></li>';
  }
  function toggleNoBuy(shopId) {
    var d = S.date, ex = null;
    S.entries.forEach(function (e) { if (e.shopId === shopId && e.date === d && e.type === 'nobuy') ex = e; });
    if (ex) { removeDoc('entries', ex.id).then(function (ok) { if (ok) toast('"Did not buy" Changed'); }); return; }
    var sh = shopById(shopId), doc = { id: uid(), shopId: shopId, type: 'nobuy', amount: 0, date: d, note: '', createdAt: Date.now() };
    if (sh && sh.routeId) doc.routeId = sh.routeId;
    var sid = defaultEntryStaff(shopId); if (sid) doc.staffId = sid;
    saveDoc('entries', doc).then(function (ok) { if (ok) toast('Marked as did not buy'); });
  }
  function routeBlock(r, d) {
    var shops = shopsOfRoute(r.id), st = routeStat(r, d), veh = routeVehicleFor(r.id, d), sid = routeStaffFor(r.id, d), future = d > todayStr();
    var c = { sale: 0, nobuy: 0, other: 0, none: 0 };
    var tiles = shops.map(function (sh) { c[shopDay(sh.id, d).status]++; return shopTile(sh, d); });
    var h = '<section class="rblock"><div class="rhead"><div style="min-width:0"><div class="sname">' + esc(r.name) + (routeDue(r, d) ? '' : ' <span class="chip due">Excess</span>') + '</div>' +
      '<div class="muted sm">' + esc(routeWhen(r)) + '</div><div class="muted sm">' + esc(staffLabel(sid)) + (veh ? ' · ' + esc(veh) : '') + '</div></div>' +
      '<div class="bal due"><small>Sale</small><b class="num">' + fmt(st.sale) + '</b></div></div>';
    h += '<div class="chips">' + '<span class="chip ok">Bought ' + c.sale + '</span><span class="chip nobuy">Did not buy ' + c.nobuy + '</span>' + (c.other ? '<span class="chip due">Cash/return ' + c.other + '</span>' : '') + (future ? '' : '<span class="chip red">No entry ' + c.none + '</span>') + '<span class="chip">Total ' + shops.length + ' Shop</span></div>';
    h += '<div class="two" style="margin:0"><button class="btn sm" data-act="route-run" data-id="' + esc(r.id) + '" data-date="' + d + '">Staff / vehicle</button><button class="btn sm" data-act="add-shop" data-route="' + esc(r.id) + '">+ Shops on this route</button></div>';
    if (shops.length) h += '<button class="btn block wabtn" data-act="ask" data-route="' + esc(r.id) + '">Ask for orders on WhatsApp · ' + shops.length + (shops.length === 1 ? ' shop' : ' shops') + '</button>';
    h += shops.length ? '<ul class="list tiles">' + tiles.join('') + '</ul>' : '<div class="empty">No shops on this route yet.</div>';
    return h + '</section>';
  }

  function vToday() {
    var d = S.date, es = S.entries.filter(function (e) { return e.date === d; }).sort(byDate).reverse();
    var exs = S.expenses.filter(function (x) { return x.date === d; });
    var sm = sums(es), ex = totalExp(exs), cash = sm.payment - ex, o = overall();
    var wd = String(parse(d).getDay());
    var rts = S.pick[d] ? S.routes.filter(function (r) { return S.pick[d].indexOf(r.id) >= 0; }).sort(byName) : S.routes.filter(function (r) { return routeDue(r, d) || routeStat(r, d).n > 0 || runOf(r.id, d) || S.extra[r.id + '|' + d]; }).sort(byName);
    var shown = {}; rts.forEach(function (r) { shown[r.id] = true; });
    var others = S.routes.filter(function (r) { return !shown[r.id]; }).sort(byName);
    var loose = S.shops.filter(function (s) {
      if (S.routes.length && s.routeId && routeById(s.routeId)) return false;
      if (!S.routes.length) return true;
      return (s.day !== '' && s.day != null && String(s.day) === wd) || es.some(function (e) { return e.shopId === s.id; });
    }).sort(byName);
    var sold = soldByItem(es), soldKeys = Object.keys(sold);

    var h = '<h1 class="page-title" style="margin-bottom:10px">Today</h1>' + dateBar();
    h += '<section class="hero"><div class="hero-top"><span>Sale</span><b class="num">' + fmt(sm.sale) + '</b></div>' +
      '<div class="hero-row"><div><small>Cash received</small><b class="num">' + fmt(sm.payment) + '</b></div><div><small>Return</small><b class="num">' + fmt(sm['return']) + '</b></div><div><small>Expense</small><b class="num">' + fmt(ex) + '</b></div></div>' +
      (OWNER ? '<div class="hero-net ' + (cash < 0 ? 'neg' : '') + '"><span>Cash in hand <i>(Cash received − Expense)</i></span><b class="num">' + (cash < 0 ? '−' : '') + fmt(cash) + '</b></div>' : '') + '</section>';
    if (OWNER) {
      h += '<div class="ledger-strip"><div class="rec"><span>Total receivable</span><b class="num">' + fmt(o.rec) + '</b></div><div class="pay"><span>Total payable</span><b class="num">' + fmt(o.pay) + '</b></div></div>';
    }
    h += '<div class="actions-row"><button class="btn primary" data-act="add-entry" data-type="sale">+ Sale</button><button class="btn" data-act="add-entry" data-type="payment">+ Cash received</button><button class="btn" data-act="add-entry" data-type="return">+ Return</button></div>';
    h += '<div class="two" style="margin-bottom:0"><button class="btn" data-act="add-exp">+ Expense (petrol, food)</button><button class="btn" data-act="add-move">+ Purchase / stock</button></div>';
    h += '<button class="btn block" style="margin-top:8px" data-act="day-report">Send today’s statement on WhatsApp</button>';

    h += '<div class="sec"><h2>Route · shops</h2><button class="btn sm" data-act="sview" data-v="routes">All routes</button></div>';
    if (S.routes.length) h += '<div class="muted sm" style="margin:4px 0 6px">Select route (one or more):</div><div class="chips" style="margin-bottom:10px">' + S.routes.slice().sort(byName).map(function (r) {
      return '<button class="filter" data-act="pick-route" data-id="' + esc(r.id) + '" aria-pressed="' + (!!shown[r.id]) + '">' + esc(r.name) + '</button>';
    }).join('') + (S.pick[d] ? '<button class="filter" data-act="pick-route" data-id="_due">Due today</button>' : '') + '</div>';
    h += '<div class="legend"><span class="chip ok">Sale done</span><span class="chip nobuy">Did not buy</span><span class="chip red">No entry</span></div>';
    if (rts.length) h += rts.map(function (r) { return routeBlock(r, d); }).join('');
    else if (S.routes.length) h += '<div class="empty">' + esc(longDate(d)) + ' No route due. You can pick a route below if needed.</div>';
    else if (!(S.mode === 'cloud' && !S.loaded) && !S.shops.length) {
      h += '<div class="empty"><div>Add routes and shops first. Then each day the shops of the routes due that day will appear here.</div><div class="two" style="width:100%"><button class="btn primary" data-act="add-route">+ Route</button><button class="btn primary" data-act="add-shop">+ Shop</button></div></div>';
    }
    if (loose.length) h += '<div class="sec"><h2>' + (S.routes.length ? 'Shops without route' : 'Shops') + '</h2></div><ul class="list tiles">' + loose.map(function (s) { return shopTile(s, d); }).join('') + '</ul>';

    h += '<div class="sec"><h2>Today’s entries</h2><span class="muted sm">' + es.length + '</span></div>';
    if (S.mode === 'cloud' && !S.loaded) h += '';
    else if (!es.length) h += '<div class="empty">No entries yet for this day.</div>';
    else h += '<ul class="list">' + es.map(function (e) { return entryRow(e); }).join('') + '</ul>';
    if (soldKeys.length) {
      h += '<div class="sec"><h2>Items sold today</h2></div><div class="tablewrap"><table><tbody>' + soldKeys.sort(function (a, b) { return sold[b] - sold[a]; }).map(function (k) {
        return '<tr><td>' + esc(itemName(k)) + '</td><td class="n">' + qf(sold[k]) + ' ' + esc(unitOf(k)) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    }
    if (exs.length) h += '<div class="sec"><h2>Today’s expenses</h2></div><ul class="list">' + exs.map(expRow).join('') + '</ul>';
    return h;
  }

  function vShops() {
    var q = S.q.trim().toLowerCase();
    var list = S.shops.filter(shopVisible).filter(function (s) {
      var b = balanceOf(s.id);
      if (S.rfilter && (S.rfilter === '_none' ? s.routeId : s.routeId !== S.rfilter)) return false;
      if (S.filter === 'rec' && !(b > 0)) return false;
      if (S.filter === 'pay' && !(b < 0)) return false;
      return !q || (s.name || '').toLowerCase().indexOf(q) >= 0 || (s.phone || '').indexOf(q) >= 0 || (s.area || '').toLowerCase().indexOf(q) >= 0;
    });
    if (S.filter === 'rec') list.sort(function (a, b) { return balanceOf(b.id) - balanceOf(a.id); }); else list.sort(byName);
    var o = overall();
    var h = '<div class="sec" style="margin-top:0"><h1 class="page-title">Shops</h1><button class="btn primary sm" data-act="add-shop">+ New shop</button></div>';
    h += viewToggle('list');
    h += '<div class="ledger-strip"><div class="rec"><span>Receivable</span><b class="num">' + fmt(o.rec) + '</b></div><div class="pay"><span>Payable</span><b class="num">' + fmt(o.pay) + '</b></div></div>';
    h += '<input class="search" id="q" type="search" placeholder="Search by shop name / phone / place" value="' + esc(S.q) + '" aria-label="Search shop">';
    h += routeSelect();
    h += '<div class="chips" style="margin-bottom:12px">' + [['all', 'All'], ['rec', 'Receivable'], ['pay', 'Payable']].map(function (f) {
      return '<button class="filter" data-act="filter" data-f="' + f[0] + '" aria-pressed="' + (S.filter === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div>';
    if (!S.shops.length) {
      if (S.mode === 'cloud' && !S.loaded) return h;
      return h + '<div class="empty"><div>No shops added yet. Add shop name, phone number and route.</div><button class="btn primary" data-act="add-shop">+ Add the first shop</button></div>';
    }
    if (!list.length) return h + '<div class="empty">Nothing found.</div>';
    return h + '<ul class="list">' + list.map(function (s) {
      var b = balanceOf(s.id), meta = [];
      if (s.area) meta.push(esc(s.area));
      if (s.routeId) meta.unshift('<b>' + esc(routeName(s.routeId)) + '</b>'); else if (s.day !== '' && s.day != null) meta.push(DAYS[Number(s.day)]);
      if (s.phone) meta.push(esc(s.phone));
      return '<li><button class="shop-card" data-act="open-shop" data-id="' + esc(s.id) + '"><div><div class="sname">' + esc(s.name) + '</div><div class="muted sm">' + (meta.join(' · ') || 'Details not added') + '</div></div>' +
        '<div class="bal ' + balClass(b) + '"><small>' + balLabel(b) + '</small>' + (b === 0 ? '' : '<b class="num">' + fmt(b) + '</b>') + '</div></button></li>';
    }).join('') + '</ul>';
  }

  function vShop() {
    var s = shopById(S.shopId);
    if (!s) { S.shopId = null; return vShops(); }
    var b = balanceOf(s.id);
    var list = S.entries.filter(function (e) { return e.shopId === s.id; }).sort(byDate), run = 0;
    var rows = list.map(function (e) { var t = TYPES[e.type]; if (t) run += t.sign * (Number(e.amount) || 0); return { e: e, bal: run }; }).reverse();
    var meta = [];
    if (s.area) meta.push(esc(s.area));
    if (s.routeId) meta.unshift(esc(routeName(s.routeId)) + ' Route'); else if (s.day !== '' && s.day != null) meta.push('Weekly on ' + DAYS[Number(s.day)]);

    h += '<div class="balbox ' + balClass(b) + '"><span>' + balLabel(b) + '</span>' + (b === 0 ? '' : '<b class="num">' + fmt(b) + '</b>') + '</div>';
    h += '<div class="two"><button class="btn primary" data-act="wa" data-id="' + esc(s.id) + '">WhatsApp Message</button><button class="btn" data-act="edit-shop" data-id="' + esc(s.id) + '">Shop edit</button></div>';
    h += '<div class="actions-row"><button class="btn" data-act="add-entry" data-type="sale" data-shop="' + esc(s.id) + '">+ Sale</button><button class="btn" data-act="add-entry" data-type="payment" data-shop="' + esc(s.id) + '">+ Cash</button><button class="btn" data-act="add-entry" data-type="return" data-shop="' + esc(s.id) + '">+ Return</button></div>';
    h += '<div class="sec"><h2>Statement history</h2><button class="btn sm" data-act="add-entry" data-type="opening" data-shop="' + esc(s.id) + '">Old balance / other</button></div>';

  function stockChip(it, st) {

  }

  function stockTabs() {
    return '<div class="chips" style="margin-bottom:12px">' + [['stock', 'Stock'], ['purchase', 'Purchase'], ['items', 'Items (' + S.items.length + ')']].map(function (f) {
      return '<button class="filter" data-act="stview" data-v="' + f[0] + '" aria-pressed="' + (S.stockView === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div>';
  }
  function vStock() { return S.stockView === 'purchase' ? vPurch() : S.stockView === 'items' ? vItems() : vStockMain(); }

  function vStockMain() {
    var sm = stockMap(), q = S.iq.trim().toLowerCase(), td = todayStr();

    }).join('') + '</ul>';
  }

  function vPurch() {
    var mv = S.moves.slice().sort(byDate).reverse(), ym = todayStr().slice(0, 7), mcost = 0, mn = 0;
    S.moves.forEach(function (m) { if (m.kind !== 'adjust' && String(m.date).indexOf(ym) === 0) { mcost += Number(m.cost) || 0; mn++; } });

        '<div>' + esc(itemName(m.itemId)) + '</div>' + (m.cost && OWNER ? '<div class="note">Expense ' + fmt(m.cost) + '</div>' : '') + (m.staffId ? '<div class="note">Produced: ' + esc(staffName(m.staffId)) + '</div>' : '') + (m.note ? '<div class="note">' + esc(m.note) + '</div>' : '') + '</div>' +
        '<div class="ri-side"><div class="amt ' + (q < 0 ? 'ret' : 'ok') + '">' + (q > 0 ? '+' : q < 0 ? '−' : '') + qf(Math.abs(q)) + '</div>' + delBtn('moves', m.id) + '</div></li>';

  }

  function vItems() {
    var q = S.iq.trim().toLowerCase();
    var list = S.items.filter(function (it) { return !q || (it.name || '').toLowerCase().indexOf(q) >= 0; }).sort(byName);
    var h = '<div class="sec" style="margin-top:0"><h1 class="page-title">Items</h1>' + (OWNER ? '<button class="btn primary sm" data-act="add-item">+ Item</button>' : '') + '</div>' + stockTabs();
    if (S.items.length > 4) h += '<input class="search" id="iq" type="search" placeholder="Search item" value="' + esc(S.iq) + '" aria-label="Search item">';
    if (!S.items.length) {
      if (S.mode === 'cloud' && !S.loaded) return h;
      return h + '<div class="empty"><div>No items added yet. Add each one (peanut candy, sona papdi, Baslimar, quail eggs...) with name, price and daily required stock.</div>' + (OWNER ? '<button class="btn primary" data-act="add-item">+ Add the first item</button>' : '') + '</div>';
    }

      var meta = [];

        (OWNER ? '<div class="item-actions"><button class="btn sm" data-act="edit-item" data-id="' + esc(it.id) + '">Edit</button></div>' : '') + '</li>';
    }).join('') + '</ul>';
  }

  function computeNeeds() {
    var sm = stockMap(), pm = pendingMap(), map = {}, order = [];
    S.items.slice().sort(byName).forEach(function (it) {
      var t = Number(it.target) || 0; if (t <= 0) return;
      var st = sm[it.id] || 0, pend = pm[it.id] || 0, need = r2(t - st - pend);
      if (need <= 0) return;
      var key = (it.sphone || '') + '|' + (it.sname || '');
      if (!map[key]) { map[key] = { sname: it.sname || '', sphone: it.sphone || '', rows: [] }; order.push(key); }
      map[key].rows.push({ item: it, stock: st, pend: pend, need: need });
    });
    return order.map(function (k) { return map[k]; });
  }

  function vOrders() {
    GROUPS = computeNeeds();
    var withTarget = S.items.filter(function (it) { return Number(it.target) > 0; }).length;
    var pending = S.orders.filter(function (o) { return o.status === 'pending'; }).sort(byDate).reverse();
    var h = '<h1 class="page-title">Production order</h1><p class="lead">Shown here is the daily required stock minus current stock and ordered quantity. You can send a separate slip for each item, or all items of one person together.</p>';
    if (!S.items.length || !withTarget) {
      if (!(S.mode === 'cloud' && !S.loaded)) h += '<div class="empty"><div>Added item "Daily required stock" If entered, how many to make will show here automatically. e.g. 50 needed daily, 45 sold, then 45 are needed again.</div><button class="btn primary" data-act="' + (S.items.length ? 'tab" data-tab="stock' : 'add-item') + '">' + (S.items.length ? 'Go to Stock' : '+ Add item') + '</button></div>';
    } else if (!GROUPS.length) {

      h += '<div style="display:grid;gap:12px">' + GROUPS.map(function (g, gi) {
        return '<section class="group"><h3>' + esc(g.sname || (g.sphone ? g.sphone : 'Producer not added')) + (g.sname && g.sphone ? ' <span class="muted sm">' + esc(g.sphone) + '</span>' : '') + '</h3>' +
          g.rows.map(function (r) {
            return '<div class="gline"><div><div class="iname">' + esc(r.item.name) + '</div><div class="muted sm">Stock ' + qf(r.stock) + ' · Target ' + qf(r.item.target) + (r.pend ? ' · On order ' + qf(r.pend) : '') + '</div></div>' +

  /* ---------- reports: any date range, owner only ---------- */
  var fdate = function (s) { var d = parse(s); return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear(); };
  function inR(d) { return d >= S.from && d <= S.to; }
  function rangeBar() {
    var t = todayStr(), m1 = t.slice(0, 8) + '01', pm = addMonth(t.slice(0, 7), -1), mon = mondayOf(t);
    var q = [['Today', t, t], ['This week', mon, addDays(mon, 6)], ['This month', m1, t], ['Last month', pm + '-01', addDays(m1, -1)]];
    return '<div class="rangebar"><div><label for="rg_from">From date</label><input type="date" id="rg_from" value="' + S.from + '"></div><div><label for="rg_to">To date</label><input type="date" id="rg_to" value="' + S.to + '"></div></div>' +
      '<div class="chips" style="margin:8px 0 14px">' + q.map(function (x) {
        return '<button class="filter" data-act="rq" data-a="' + x[1] + '" data-b="' + x[2] + '" aria-pressed="' + (S.from === x[1] && S.to === x[2]) + '">' + x[0] + '</button>';

  function vReport() {

    var body = S.rsub === 'dash' ? vDash() : S.rsub === 'backup' ? vBackup() : rangeBar() + (S.rsub === 'exp' ? vExp() : S.rsub === 'route' ? vRouteReport() : vSum());
    return '<h1 class="page-title" style="margin-bottom:10px">Report</h1>' + seg + body;
  }

  function rangeAgg() {
    var es = S.entries.filter(function (e) { return inR(e.date); }), ex = S.expenses.filter(function (x) { return inR(x.date); });
    var span = Math.round((parse(S.to) - parse(S.from)) / 86400000) + 1, monthly = span > 62;
    var key = function (d) { return monthly ? d.slice(0, 7) : d; };
    var A = { es: es, ex: ex, sm: sums(es), exT: totalExp(ex), monthly: monthly, by: {}, shops: {}, items: {}, cats: {}, nobuy: 0 };
    var B = function (k) { return A.by[k] || (A.by[k] = { sale: 0, payment: 0, ret: 0, exp: 0 }); };
    var SH = function (k) { return A.shops[k] || (A.shops[k] = { sale: 0, payment: 0, ret: 0 }); };
    var IT = function (k) { return A.items[k] || (A.items[k] = { q: 0, amt: 0, rq: 0 }); };
    es.forEach(function (e) {
      var a = Number(e.amount) || 0;
      if (e.type === 'nobuy') { A.nobuy++; return; }
      if (e.type === 'sale') {
        B(key(e.date)).sale += a; SH(e.shopId).sale += a;
        (e.lines || []).forEach(function (l) { var o = IT(l.i), q = Number(l.q) || 0; o.q += q; o.amt += q * (Number(l.p) || 0); });
      } else if (e.type === 'payment') { B(key(e.date)).payment += a; SH(e.shopId).payment += a; }
      else if (e.type === 'return') {
        B(key(e.date)).ret += a; SH(e.shopId).ret += a;
        (e.lines || []).forEach(function (l) { IT(l.i).rq += Number(l.q) || 0; });
      }
    });
    ex.forEach(function (x) { B(key(x.date)).exp += Number(x.amount) || 0; A.cats[x.cat] = (A.cats[x.cat] || 0) + (Number(x.amount) || 0); });
    A.keys = Object.keys(A.by).sort();
    return A;
  }
  function keyLabel(A, k) { return A.monthly ? monthName(k + '-01') : DAYS[parse(k).getDay()] + ' ' + fdate(k); }

  function vSum() {
    var A = rangeAgg(), cash = A.sm.payment - A.exT, tot = { sale: 0, payment: 0, ret: 0, exp: 0 };
    var rows = A.keys.map(function (k) {
      var b = A.by[k]; tot.sale += b.sale; tot.payment += b.payment; tot.ret += b.ret; tot.exp += b.exp;
      return '<tr><td>' + esc(keyLabel(A, k)) + '</td><td class="n">' + qf(b.sale) + '</td><td class="n">' + qf(b.payment) + '</td><td class="n">' + qf(b.ret) + '</td><td class="n">' + qf(b.exp) + '</td></tr>';
    });
    var h = '<div class="muted sm" style="margin-bottom:8px">' + esc(fdate(S.from)) + ' From ' + esc(fdate(S.to)) + ' To</div>';
    h += '<div class="stats"><div class="stat due"><span>Sale</span><b>' + fmt(A.sm.sale) + '</b></div><div class="stat ok"><span>Cash received</span><b>' + fmt(A.sm.payment) + '</b></div>' +
      '<div class="stat ret"><span>Return</span><b>' + fmt(A.sm['return']) + '</b></div><div class="stat owe"><span>Expense</span><b>' + fmt(A.exT) + '</b></div></div>';
    h += '<div class="net ' + (cash < 0 ? 'neg' : 'pos') + '"><span>Cash in hand<br><span class="muted sm">Cash received − Expense</span></span><b class="num">' + (cash < 0 ? '−' : '') + fmt(cash) + '</b></div>';
    h += '<div class="muted sm" style="margin-bottom:6px">Marked as did not buy: ' + A.nobuy + ' Times</div>';
    h += '<div class="sec" style="margin-top:8px"><h2>' + (A.monthly ? 'By month' : 'By day') + '</h2></div>';
    h += rows.length ? '<div class="tablewrap"><table><thead><tr><th>' + (A.monthly ? 'Month' : 'Day') + '</th><th class="n">Sale</th><th class="n">Received</th><th class="n">Return</th><th class="n">Expense</th></tr></thead><tbody>' + rows.join('') +
      '</tbody><tfoot><tr><td>Total</td><td class="n">' + qf(tot.sale) + '</td><td class="n">' + qf(tot.payment) + '</td><td class="n">' + qf(tot.ret) + '</td><td class="n">' + qf(tot.exp) + '</td></tr></tfoot></table></div>' : '<div class="empty">No entries in this period.</div>';
    var sk = Object.keys(A.shops).sort(function (a, b) { return A.shops[b].sale - A.shops[a].sale; });
    h += '<div class="sec"><h2>By shop</h2></div>';
    h += sk.length ? '<div class="tablewrap"><table><thead><tr><th>Shop</th><th class="n">Sale</th><th class="n">Received</th><th class="n">Return</th><th class="n">Current balance</th></tr></thead><tbody>' + sk.map(function (id) {
      var s = shopById(id), o = A.shops[id], b = balanceOf(id);
      return '<tr><td>' + esc(s ? s.name : '(deleted shop)') + '</td><td class="n">' + qf(o.sale) + '</td><td class="n">' + qf(o.payment) + '</td><td class="n">' + qf(o.ret) + '</td><td class="n">' + (b < 0 ? '−' : '') + qf(Math.abs(b)) + '</td></tr>';
    }).join('') + '</tbody></table></div><p class="muted sm">Balance: + means receivable, − means payable.</p>' : '<div class="empty">No shop entries in this period.</div>';
    var ik = Object.keys(A.items).sort(function (a, b) { return A.items[b].q - A.items[a].q; });
    h += '<div class="sec"><h2>By item</h2></div>';
    h += ik.length ? '<div class="tablewrap"><table><thead><tr><th>Item</th><th class="n">Sold</th><th class="n">Amount</th><th class="n">Return</th></tr></thead><tbody>' + ik.map(function (k) {
      var o = A.items[k]; return '<tr><td>' + esc(itemName(k)) + '</td><td class="n">' + qf(o.q) + ' ' + esc(unitOf(k)) + '</td><td class="n">' + qf(o.amt) + '</td><td class="n">' + qf(o.rq) + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">If an item is selected in the sale, the count will show here.</div>';
    h += '<div class="sec"><h2>To keep this report</h2></div><div class="two"><button class="btn primary" data-act="export" data-kind="range">Report (CSV)</button><button class="btn" data-act="export" data-kind="rentries">Entries (CSV)</button></div>';
    h += '<div class="two"><button class="btn" data-act="export" data-kind="rexpenses">Expenses (CSV)</button><button class="btn" data-act="export" data-kind="all">Full data backup</button></div>';
    h += '<p class="muted sm">CSV The file can be opened in Excel / Google Sheets. Change the dates above to get that period’s report.</p>';
    return h;
  }

  function rangeRows() {
    var A = rangeAgg(), rows = [];
    rows.push([BRAND + ' - Report', S.from + ' From ' + S.to + ' To'], [], ['Sale', A.sm.sale], ['Cash received', A.sm.payment], ['Return', A.sm['return']], ['Expense', A.exT],
      ['Cash in hand (money − expenses)', A.sm.payment - A.exT], ['Did not buy (times)', A.nobuy], [], [A.monthly ? 'Month' : 'Date', 'Sale', 'Received', 'Return', 'Expense']);
    A.keys.forEach(function (k) { var b = A.by[k]; rows.push([k, b.sale, b.payment, b.ret, b.exp]); });
    rows.push([], ['Shop', 'Sale', 'Received', 'Return', 'Current balance']);
    Object.keys(A.shops).forEach(function (id) { var s = shopById(id), o = A.shops[id]; rows.push([s ? s.name : '(deleted shop)', o.sale, o.payment, o.ret, balanceOf(id)]); });
    rows.push([], ['Item', 'Count', 'Amount', 'Return count']);
    Object.keys(A.items).forEach(function (k) { var o = A.items[k]; rows.push([itemName(k), o.q, o.amt, o.rq]); });
    rows.push([], ['Expense type', 'Amount']);
    Object.keys(A.cats).forEach(function (c) { rows.push([c, A.cats[c]]); });
    return rows;
  }

  function vExp() {
    var list = S.expenses.filter(function (x) { return inR(x.date); }).sort(byDate).reverse(), byCat = {};
    list.forEach(function (x) { byCat[x.cat] = (byCat[x.cat] || 0) + (Number(x.amount) || 0); });
    var h = '<div class="stats"><div class="stat owe"><span>Expense in this period</span><b>' + fmt(totalExp(list)) + '</b></div><div class="stat"><span>Entries</span><b>' + list.length + '</b></div></div>';
    var cats = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });

    h += '<div class="sec"><h2>Expenses</h2><button class="btn primary sm" data-act="add-exp">+ Expense</button></div>';
    h += list.length ? '<ul class="list">' + list.map(function (x) { return '<li class="row-item"><div class="ri-main"><div class="ri-top"><span class="chip owe">' + esc(x.cat) + '</span><span class="muted sm">' + esc(shortDate(x.date)) + '</span>' + (x.routeId ? '<span class="muted sm">' + esc(routeName(x.routeId)) + '</span>' : '') + '</div>' + (x.note ? '<div class="note">' + esc(x.note) + '</div>' : '') + '</div><div class="ri-side"><div class="amt">' + fmt(x.amount) + '</div>' + delBtn('expenses', x.id) + '</div></li>'; }).join('') + '</ul>' : '<div class="empty">No expenses added in this period.</div>';
    h += '<div class="two" style="margin-top:12px"><button class="btn" data-act="export" data-kind="rexpenses">Expenses (CSV)</button></div>';
    return h;
  }

  function vBackup() {
    var h = '<div class="sec" style="margin-top:0"><h2>Take backup</h2></div><div class="two"><button class="btn primary" data-act="export" data-kind="all">All data (backup file)</button><label class="btn" for="restore" style="display:inline-flex;align-items:center;justify-content:center;text-align:center">Restore backup</label></div>';
    h += '<input id="restore" type="file" accept=".json,application/json" hidden>';

    h += '<div class="two"><button class="btn" data-act="export" data-kind="shops">Shops + Balance</button><button class="btn" data-act="export" data-kind="stock">Stock</button></div>';
    h += '<p class="muted sm">If you want a report from date to date, "Statement" In the tab select a date and tap its CSV button. Keep the backup file on your phone / Google Drive regularly.</p>';

  }

  /* ---------- routes ---------- */
  function routeById(id) { for (var i = 0; i < S.routes.length; i++) if (S.routes[i].id === id) return S.routes[i]; return null; }
  function routeName(id) { var r = routeById(id); return r ? r.name : '(deleted route)'; }
  function routeOptions(sel) {
    return S.routes.slice().sort(byName).map(function (r) { return '<option value="' + esc(r.id) + '"' + (r.id === sel ? ' selected' : '') + '>' + esc(r.name) + '</option>'; }).join('');
  }
  function nthOf(d) { return Math.ceil(parse(d).getDate() / 7); }
  function routeDue(r, d) {
    if (r.day === '' || r.day == null || String(r.day) !== String(parse(d).getDay())) return false;
    var w = r.weeks; return !w || !w.length || w.indexOf(nthOf(d)) >= 0;
  }
  function routeWhen(r) {
    var w = (r.weeks || []).slice().sort(), every = !w.length || w.length >= 5;
    return DAYS[Number(r.day)] + ' · ' + (every ? 'Every week' : 'Weeks of the month: ' + w.join(', ') + ' Week');
  }
  function nextVisit(r, from) {
    if (r.day === '' || r.day == null) return '';
    for (var i = 0; i < 70; i++) { var d = addDays(from, i); if (routeDue(r, d)) return d; }
    return '';
  }
  function shopsOfRoute(id) { return S.shops.filter(function (x) { return x.routeId === id; }).sort(byName); }
  function runOf(rid, d) { var id = rid + '_' + d; for (var i = 0; i < S.runs.length; i++) if (S.runs[i].id === id) return S.runs[i]; return null; }
  function routeStaffFor(rid, d) { var u = runOf(rid, d), r = routeById(rid); return (u && u.staffId) || (r && r.staffId) || ''; }
  function routeVehicleFor(rid, d) { var u = runOf(rid, d), r = routeById(rid); return (u && u.vehicle) || (r && r.vehicle) || ''; }
  function entryRoute(e) { if (e.routeId) return e.routeId; var x = shopById(e.shopId); return x && x.routeId ? x.routeId : ''; }
  function defaultEntryStaff(shopId) { var x = shopById(shopId), id = x && x.routeId ? routeStaffFor(x.routeId, S.date) : ''; return meStaffId() || id || S.lastSales; }
  function syncEntryStaff() {
    var sh = document.getElementById('e_shop'), st = document.getElementById('e_staff'); if (!sh || !st) return;
    var x = shopById(sh.value), dt = document.getElementById('e_date'), id = x && x.routeId ? routeStaffFor(x.routeId, (dt && dt.value) || S.date) : '';
    if (id && !meStaffId()) st.value = id;
  }
  function routeStat(r, d) {
    var o = { sale: 0, payment: 0, ret: 0, exp: 0, visited: 0, n: 0 }, seen = {};
    S.entries.forEach(function (e) {
      if (e.date !== d || entryRoute(e) !== r.id) return;
      var a = Number(e.amount) || 0;
      if (e.type === 'sale') o.sale += a; else if (e.type === 'payment') o.payment += a; else if (e.type === 'return') o.ret += a; else if (e.type !== 'nobuy') return;
      o.n++; seen[e.shopId] = true;
    });
    o.visited = Object.keys(seen).length;
    S.expenses.forEach(function (x) { if (x.date === d && x.routeId === r.id) o.exp += Number(x.amount) || 0; });
    return o;
  }
  function staffLabel(id) { return id ? staffName(id) : 'Staff not set'; }
  function viewToggle(cur) {
    return '<div class="chips" style="margin-bottom:12px">' + [['list', 'Shops'], ['routes', 'Routes (' + S.routes.length + ')'], ['edit', 'Edit']].map(function (f) {

  function vShopsEdit() {
    var q = S.q.trim().toLowerCase();
    var h = '<div class="sec" style="margin-top:0"><h1 class="page-title">Shops</h1></div>' + viewToggle('edit');
    h += '<div class="two"><button class="btn primary" data-act="add-shop">+ New shop</button><button class="btn primary" data-act="add-route">+ New route</button></div>';
    h += '<div class="sec"><h2>Routes (' + S.routes.length + ')</h2></div>';
    h += S.routes.length ? '<ul class="list">' + S.routes.slice().sort(byName).map(function (r) {
      return '<li class="row-item"><div class="ri-main"><b>' + esc(r.name) + '</b><div class="note">' + esc(routeWhen(r)) + ' · ' + shopsOfRoute(r.id).length + ' Shops' + (r.staffId ? ' · ' + esc(staffName(r.staffId)) : '') + (r.vehicle ? ' · ' + esc(r.vehicle) : '') + '</div></div>' +
        '<div class="ri-side"><button class="btn sm" data-act="edit-route" data-id="' + esc(r.id) + '">Edit</button></div></li>';

  /* ---------- dashboard ---------- */
  function dashYears() {
    var ys = {}, cy = todayStr().slice(0, 4); ys[cy] = 1;
    S.entries.forEach(function (e) { if (e.date) ys[e.date.slice(0, 4)] = 1; });
    return Object.keys(ys).sort();
  }
  function dashAgg() {
    var per = S.dper, y = S.dy, cm = todayStr().slice(0, 7);
    var inP = function (d) { return per === 'all' ? true : per === 'month' ? d.slice(0, 7) === cm : d.slice(0, 4) === y; };
    var bk = function (d) { return per === 'month' ? d.slice(8) : per === 'all' ? d.slice(0, 4) : d.slice(5, 7); };
    var A = { sale: 0, ret: 0, pay: 0, qty: 0, exp: 0, n: 0, shops: {}, items: {}, routes: {}, series: {}, im: {} };
    S.entries.forEach(function (e) {
      if (!e.date || !inP(e.date)) return;
      var a = Number(e.amount) || 0;
      if (e.type === 'sale') {
        A.sale += a; A.n++;
        A.shops[e.shopId] = (A.shops[e.shopId] || 0) + a;
        var rid = entryRoute(e) || ''; A.routes[rid] = (A.routes[rid] || 0) + a;
        var k = bk(e.date); A.series[k] = (A.series[k] || 0) + a;
        (e.lines || []).forEach(function (l) {
          var q = Number(l.q) || 0, o = A.items[l.i] || (A.items[l.i] = { q: 0, amt: 0 });
          o.q += q; o.amt += q * (Number(l.p) || 0); A.qty += q;
          var im = A.im[l.i] || (A.im[l.i] = {}); im[k] = (im[k] || 0) + q;
        });
      } else if (e.type === 'return') A.ret += a; else if (e.type === 'payment') A.pay += a;
    });
    S.expenses.forEach(function (x) { if (x.date && inP(x.date)) A.exp += Number(x.amount) || 0; });
    var keys = [], labels = [], i;
    if (per === 'month') { var dim = new Date(Number(cm.slice(0, 4)), Number(cm.slice(5, 7)), 0).getDate(); for (i = 1; i <= dim; i++) { keys.push(pad(i)); labels.push(String(i)); } }
    else if (per === 'all') { var yy = dashYears(); yy.forEach(function (v) { keys.push(v); labels.push(v); }); }
    else for (i = 1; i <= 12; i++) { keys.push(pad(i)); labels.push(MONTHS[i - 1].slice(0, 3)); }
    A.keys = keys; A.labels = labels;
    return A;
  }
  function colChart(keys, labels, vals, unit) {
    var mx = Math.max.apply(null, vals.concat([0])), best = mx > 0 ? vals.indexOf(mx) : -1, showV = keys.length <= 12;
    return '<div class="cols' + (keys.length > 12 ? ' dense' : '') + '" role="img" aria-label="Bar chart">' + keys.map(function (k, i) {
      var v = vals[i], hp = v > 0 ? Math.max(3, Math.round(v / mx * 100)) : 0;
      return '<div class="col' + (i === best ? ' best' : '') + '"><span class="cv">' + (showV && v > 0 ? (unit === '₹' ? cf(v) : qf(v)) : '') + '</span><div class="cb"><i style="height:' + hp + '%"></i></div><span class="cl">' + esc(labels[i]) + '</span></div>';
    }).join('') + '</div>';
  }
  function hbars(rows) {
    var mx = Math.max.apply(null, rows.map(function (r) { return r.v; }).concat([0]));
    return '<div class="hbs">' + rows.map(function (r) {
      return '<div class="hb ' + (r.cls || '') + '"><div class="hbl"><span>' + (r.tag ? '<em>' + r.tag + '</em>' : '') + esc(r.label) + '</span><b class="num">' + r.text + '</b></div><div class="hbt"><i style="width:' + (mx > 0 ? Math.max(r.v > 0 ? 2 : 0, Math.round(r.v / mx * 100)) : 0) + '%"></i></div></div>';
    }).join('') + '</div>';
  }
  function vDash() {
    var A = dashAgg(), per = S.dper, ys = dashYears();
    if (ys.indexOf(S.dy) < 0) S.dy = ys[ys.length - 1];
    var plabel = per === 'month' ? MONTHS[Number(todayStr().slice(5, 7)) - 1] + ' ' + todayStr().slice(0, 4) : per === 'all' ? 'All time' : S.dy;
    var h = '<div class="chips" style="margin-bottom:8px">' + [['month', 'This month'], ['year', 'Year'], ['all', 'All time']].map(function (f) {
      return '<button class="filter" data-act="dper" data-v="' + f[0] + '" aria-pressed="' + (per === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div>';
    if (per === 'year') h += '<div class="chips" style="margin-bottom:10px">' + ys.map(function (y) { return '<button class="filter" data-act="dyear" data-v="' + y + '" aria-pressed="' + (S.dy === y) + '">' + y + '</button>'; }).join('') + '</div>';
    var net = A.sale - A.ret, nshops = Object.keys(A.shops).length;
    h += '<section class="hero dash"><div class="hero-top"><span>Sale · ' + esc(plabel) + '</span><b class="num">' + fmt(A.sale) + '</b></div>' +
      '<div class="hero-row"><div><small>Products sold</small><b class="num">' + qf(A.qty) + '</b></div><div><small>Shops served</small><b class="num">' + nshops + '</b></div><div><small>Bills</small><b class="num">' + A.n + '</b></div></div>' +
      '<div class="hero-row"><div><small>Return</small><b class="num">' + fmt(A.ret) + '</b></div><div><small>Cash received</small><b class="num">' + fmt(A.pay) + '</b></div><div><small>Expense</small><b class="num">' + fmt(A.exp) + '</b></div></div>' +
      '<div class="hero-net"><span>Net sale (sale − return)</span><b class="num">' + fmt(net) + '</b></div></section>';
    if (!A.n) return h + '<div class="empty">No sales in this period yet. Sales you enter on the Today page will show here as charts.</div>';

    /* top / lowest cards */
    var itemRows = Object.keys(A.items).map(function (k) { return { id: k, label: itemName(k), q: A.items[k].q, amt: A.items[k].amt }; });
    var byM = S.dm === 'amt' ? 'amt' : 'q';
    itemRows.sort(function (a, b) { return b[byM] - a[byM]; });
    var routeRows = Object.keys(A.routes).map(function (k) { return { id: k, label: k ? routeName(k) : 'No route', v: A.routes[k] }; });
    S.routes.forEach(function (r) { if (A.routes[r.id] == null) routeRows.push({ id: r.id, label: r.name, v: 0 }); });
    routeRows.sort(function (a, b) { return b.v - a.v; });
    var cards = '';
    if (itemRows.length) cards += '<div class="icard gold"><small>Top product</small><b>' + esc(itemRows[0].label) + '</b><span>' + qf(itemRows[0].q) + ' sold</span></div>';
    if (routeRows.length) cards += '<div class="icard green"><small>Best route</small><b>' + esc(routeRows[0].label) + '</b><span>' + fmt(routeRows[0].v) + '</span></div>';
    if (routeRows.length > 1) { var lo = routeRows[routeRows.length - 1]; cards += '<div class="icard pink"><small>Lowest route</small><b>' + esc(lo.label) + '</b><span>' + fmt(lo.v) + '</span></div>'; }
    h += '<div class="icards">' + cards + '</div>';

    /* trend */
    var vals = A.keys.map(function (k) { return A.series[k] || 0; }), mxv = Math.max.apply(null, vals), bi = vals.indexOf(mxv);
    h += '<div class="sec"><h2>' + (per === 'month' ? 'Daily sale' : per === 'all' ? 'Sale by year' : 'Monthly sale · ' + esc(S.dy)) + '</h2></div><section class="dcard">' + colChart(A.keys, A.labels, vals, '₹') +
      '<div class="muted sm" style="margin-top:6px">Best ' + (per === 'month' ? 'day' : per === 'all' ? 'year' : 'month') + ': <b>' + esc(A.labels[bi]) + '</b> · ' + fmt(mxv) + '</div></section>';

    /* products */
    h += '<div class="sec"><h2>Top selling products</h2><div class="chips"><button class="filter" data-act="dmet" data-v="q" aria-pressed="' + (byM === 'q') + '">Count</button><button class="filter" data-act="dmet" data-v="amt" aria-pressed="' + (byM === 'amt') + '">Amount</button></div></div>';
    h += '<section class="dcard">' + hbars(itemRows.slice(0, 10).map(function (r, i) {
      return { label: r.label, v: r[byM], text: byM === 'q' ? qf(r.q) + ' ' + esc(unitOf(r.id)) : fmt(r.amt), cls: i === 0 ? 'best' : '' };
    })) + '</section>';

    /* routes */
    h += '<div class="sec"><h2>Routes · highest to lowest</h2></div><section class="dcard">' + hbars(routeRows.map(function (r, i) {
      return { label: r.label, v: r.v, text: fmt(r.v), cls: i === 0 ? 'best' : (i === routeRows.length - 1 && routeRows.length > 1 ? 'low' : ''), tag: i === 0 ? 'Best' : (i === routeRows.length - 1 && routeRows.length > 1 ? 'Lowest' : '') };
    })) + '</section>';

    /* product-wise trend */
    var pid = S.dp && A.items[S.dp] ? S.dp : itemRows[0].id, pv = A.keys.map(function (k) { return (A.im[pid] || {})[k] || 0; });
    h += '<div class="sec"><h2>Product-wise sale</h2></div><section class="dcard"><select id="dp_sel" aria-label="Choose product">' + itemRows.slice().sort(function (a, b) { return a.label.localeCompare(b.label, 'ml'); }).map(function (r) { return '<option value="' + esc(r.id) + '"' + (r.id === pid ? ' selected' : '') + '>' + esc(r.label) + '</option>'; }).join('') + '</select>' +
      '<div class="muted sm" style="margin:6px 0">Total: <b>' + qf(A.items[pid].q) + ' ' + esc(unitOf(pid)) + '</b> · ' + fmt(A.items[pid].amt) + '</div>' + colChart(A.keys, A.labels, pv, 'q') + '</section>';

    /* product x month table */
    if (per === 'year') {
      h += '<div class="sec"><h2>Product × month (count)</h2></div><div class="tablewrap"><table><thead><tr><th>Product</th>' + A.labels.map(function (l) { return '<th class="n">' + esc(l) + '</th>'; }).join('') + '<th class="n">Total</th></tr></thead><tbody>' +
        itemRows.map(function (r) { return '<tr><td>' + esc(r.label) + '</td>' + A.keys.map(function (k) { var v = (A.im[r.id] || {})[k] || 0; return '<td class="n">' + (v ? qf(v) : '·') + '</td>'; }).join('') + '<td class="n"><b>' + qf(r.q) + '</b></td></tr>'; }).join('') + '</tbody></table></div>';
    }

    /* shops */

    h += '<div class="sec"><h2>Top 5 shops</h2></div><section class="dcard">' + hbars(shopRows.map(function (r, i) { return { label: r.label, v: r.v, text: fmt(r.v), cls: i === 0 ? 'best' : '' }; })) + '</section>';
    return h;
  }

      saveDoc('items', { id: oi ? oi.id : uid(), name: iname, unit: document.getElementById('i_unit').value.trim(), target: num('i_target'), price: num('i_price'), cost: num('i_cost'), scomm: num('i_scomm'), pcomm: num('i_pcomm'), pstaff: document.getElementById('i_pstaff').value,
        sname: document.getElementById('i_sname').value.trim(), sphone: document.getElementById('i_sphone').value.trim(), photo: document.getElementById('i_photo_data').value, createdAt: oi ? (oi.createdAt || Date.now()) : Date.now() })
        .then(function (ok) { done(ok, 'Item saved'); });
    } else if (f.id === 'moveForm') {
      var kind = f.querySelector('input[name=m_kind]:checked').value, q = num('m_qty');

      saveDoc('moves', { id: uid(), itemId: mid, staffId: kind === 'purchase' ? mst : '', rate: kind === 'purchase' && mst && mit ? (Number(mit.pcomm) || 0) : 0, qty: q, kind: kind, cost: kind === 'purchase' ? num('m_cost') : 0, date: document.getElementById('m_date').value || todayStr(), note: document.getElementById('m_note').value.trim(), createdAt: Date.now() })

        .then(function (ok) { done(ok, 'Route saved'); });
    } else if (f.id === 'runForm') {
      var rrid = f.dataset.route, rrd = f.dataset.date;
      saveDoc('runs', { id: rrid + '_' + rrd, routeId: rrid, date: rrd, staffId: document.getElementById('u_staff').value, vehicle: document.getElementById('u_veh').value.trim(), note: document.getElementById('u_note').value.trim(), createdAt: Date.now() })
        .then(function (ok) { done(ok, 'Saved'); });
    } else if (f.id === 'staffForm') {
      var os = f.dataset.id ? staffById(f.dataset.id) : null, sn = document.getElementById('st_name').value.trim();
      if (!sn) return fail('Enter the name');
      var sid2 = os ? os.id : uid(), sal = num('st_salary');
      var lgEl = document.getElementById('st_login'), pwEl = document.getElementById('st_pw');
      var lg = lgEl ? lgEl.value.trim().toLowerCase().replace(/\s+/g, '') : '', pw = pwEl ? pwEl.value : '';
      var srec = { id: sid2, name: sn, role: f.querySelector('input[name=st_role]:checked').value, phone: document.getElementById('st_phone').value.trim(), login: os && os.login ? os.login : '', createdAt: os ? (os.createdAt || Date.now()) : Date.now() };
      var chain = Promise.resolve(true);
      if (lg || pw) {
        if (!lg) return fail('Enter the login ID');
        if (!pw) return fail('Enter the password');
        if (pw.length < 6) return fail('Password needs at least 6 characters');
        if (lg.indexOf('@') < 0 && !/^[a-z0-9._-]+$/.test(lg)) return fail('Login ID may contain only lowercase English letters and digits');
        chain = createLogin(lg, pw, sid2, sn).then(function () {
          var oldLogin = srec.login; srec.login = lg;
          return oldLogin && toEmail(oldLogin) !== toEmail(lg) ? removeDoc('team', toEmail(oldLogin)) : true;
        }, function (e) { fail(loginErr(e)); return false; });
      }
      chain.then(function (ok) { return ok === false ? false : saveDoc('staff', srec); })
        .then(function (ok) { return ok ? saveDoc('staffpay', { id: sid2, salary: sal }) : false; })
        .then(function (ok) { done(ok, 'Staff saved'); });
    } else if (f.id === 'payoutForm') {
      var pa = num('p_amt'); if (pa <= 0) return fail('Enter the amount correctly');
      saveDoc('payouts', { id: uid(), staffId: f.dataset.staff, kind: f.querySelector('input[name=p_kind]:checked').value, amount: pa, date: document.getElementById('p_date').value || todayStr(), note: document.getElementById('p_note').value.trim(), createdAt: Date.now() })
        .then(function (ok) { done(ok, 'Saved'); });
    } else if (f.id === 'expForm') {
      var xa = num('x_amt');
      if (xa <= 0) return fail('Enter the amount correctly');
      saveDoc('expenses', { id: uid(), routeId: document.getElementById('x_route').value, cat: f.querySelector('input[name=x_cat]:checked').value, amount: xa, date: document.getElementById('x_date').value || S.date, note: document.getElementById('x_note').value.trim(), createdAt: Date.now() })
        .then(function (ok) { done(ok, 'Expense saved'); });
    }
  });

  /* ---------- start: Firebase sign-in + live database with offline cache ---------- */
  render();
  window.addEventListener('online', render);
  window.addEventListener('offline', render);
  if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* ignore */ }); }); }

  var FS = null, SYNC = { pending: {}, cache: {}, last: 0 };
  var WR = { n: 0, err: '', ok: 0 };
  function hideErr() { var b = document.getElementById('errbar'); if (b) b.hidden = true; }
  function showErr(e) {
    var c = (e && e.code) || 'unknown', b = document.getElementById('errbar');
    if (!b) { b = document.createElement('div'); b.id = 'errbar'; b.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#b3261e;color:#fff;padding:12px 14px;border-radius:12px;font:600 14px/1.4 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.4)'; b.onclick = function () { b.hidden = true; }; document.body.appendChild(b); }
    var why = c === 'permission-denied' ? 'Firebase rules rejected this save. Check: (1) owner email in the published rules, (2) this staff login was created from the Staff tab, (3) logged out and in again.' : c === 'unavailable' ? 'No connection to the server. It will upload automatically when online.' : 'Error while saving.';
    b.textContent = 'NOT SAVED to cloud [' + c + ']. ' + why + ' (tap to hide)'; b.hidden = false;
  }
  function syncLabel() {
    var pend = Object.keys(SYNC.pending).some(function (k) { return SYNC.pending[k]; }), cols = Object.keys(SYNC.cache), allCache = cols.length && cols.every(function (k) { return SYNC.cache[k]; });
    if (WR.err) return '⚠ Not saved [' + WR.err + ']';
    if (navigator.onLine === false) return pend ? 'Offline · pending upload' : 'Offline';
    if (pend) return 'Sending…';
    if (allCache) return 'No connection to the server';
    var d = new Date(SYNC.last || Date.now());
    return 'Online ✓ ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function refreshSync(manual) {
    if (!db || !FS) return;
    UNSUBS.forEach(function (u) { try { u(); } catch (e) { /* ignore */ } }); UNSUBS = [];
    SYNC = { pending: {}, cache: {}, last: 0 }; S.loaded = false; S.note = '';
    var go = function () { render(); subscribe(); if (manual) toast('Refreshing…'); };
    try { FS.disableNetwork().then(function () { return FS.enableNetwork(); }).then(go, go); } catch (e) { go(); }
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshSync(false); });
  function fbAdapter(fs) {
    return { collection: function (col) {
      return {
        doc: function (id) {
          var ref = fs.collection(col).doc(id);
          var run = function (p) {
            WR.n++; 
            p.then(function () { WR.n--; WR.err = ''; WR.ok = Date.now(); hideErr(); if (navigator.onLine !== false) toast('Saved to cloud ✓'); render(); })
             .catch(function (e) { WR.n--; WR.err = (e && e.code) || 'unknown'; showErr(e); render(); });
          };
          return {
            set: function (d) { try { run(ref.set(JSON.parse(JSON.stringify(d)))); } catch (e) { return Promise.reject(e); } return Promise.resolve(); },
            delete: function () { try { run(ref.delete()); } catch (e) { return Promise.reject(e); } return Promise.resolve(); }
          };
        },
        onSnapshot: function (next, err) {
          var u = fs.collection(col).onSnapshot({ includeMetadataChanges: true }, function (snap) {
            SYNC.pending[col] = snap.metadata.hasPendingWrites; SYNC.cache[col] = snap.metadata.fromCache; if (!snap.metadata.fromCache) SYNC.last = Date.now();
            next(snap);
          }, err);
          UNSUBS.push(u); return u;
        }
      };
    } };
  }
  function authMsg(e) {
    var c = (e && e.code) || '';
    if (c === 'auth/network-request-failed') return 'No internet. Internet is needed to sign in first.';
    if (c === 'auth/too-many-requests') return 'Too many wrong attempts. Try again after some time.';
    return 'Login ID or password is wrong.';
  }
  function loginErr(e) {
    var c = (e && e.code) || '';
    if (c === 'auth/email-already-in-use') return 'This login ID already exists. Enter a different ID.';
    if (c === 'auth/weak-password') return 'Password is too weak. Enter at least 6 characters.';
    if (c === 'auth/network-request-failed') return 'No internet. Internet is needed to create a login.';
    if (c === 'auth/operation-not-allowed') return 'Firebase-Email/Password is not turned on in Firebase.';
    if (c === 'auth/invalid-email') return 'Login ID is not valid.';
    return 'Could not create the login.';
  }
  function createLogin(id, pw, staffId, name) {
    var email = toEmail(id), app2;
    try { app2 = firebase.app('creator'); } catch (e) { app2 = firebase.initializeApp(window.THANIMA_CONFIG.firebase, 'creator'); }
    return app2.auth().createUserWithEmailAndPassword(email, pw)
      .then(function () { return app2.auth().signOut(); })
      .then(function () { return saveDoc('team', { id: email, staffId: staffId, name: name, createdAt: Date.now() }); })
      .then(function (ok) { if (!ok) throw { code: 'x' }; return email; });
  }
  var RULES_T = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function signedIn() { return request.auth != null; }\n    function isOwner() { return signedIn() && request.auth.token.email == '__OWNER__'; }\n    function isTeam() { return isOwner() || (signedIn() && exists(/databases/$(database)/documents/team/$(request.auth.token.email))); }\n    match /team/{email} { allow read: if isOwner() || (signedIn() && request.auth.token.email == email); allow write: if isOwner(); }\n    match /payouts/{id} { allow read, write: if isOwner(); }\n    match /staffpay/{id} { allow read, write: if isOwner(); }\n    match /_diag/{id} { allow read, write: if isTeam(); }\n    match /shops/{id} { allow read, write: if isTeam(); }\n    match /entries/{id} { allow read, write: if isTeam(); }\n    match /expenses/{id} { allow read, write: if isTeam(); }\n    match /items/{id} { allow read, write: if isTeam(); }\n    match /moves/{id} { allow read, write: if isTeam(); }\n    match /orders/{id} { allow read, write: if isTeam(); }\n    match /staff/{id} { allow read, write: if isTeam(); }\n    match /routes/{id} { allow read, write: if isTeam(); }\n    match /runs/{id} { allow read, write: if isTeam(); }\n  }\n}\n";
  function rulesText() { var c = window.THANIMA_CONFIG || {}; return RULES_T.replace('__OWNER__', c.ownerEmail ? toEmail(c.ownerEmail) : 'OWNER-EMAIL'); }
  function probeFirestore() {
    var c = (window.THANIMA_CONFIG || {}).firebase || {}, el = function () { return document.getElementById('probe'); };
    var say = function (t) { var e = el(); if (e) e.textContent = t; };
    var tm = setTimeout(function () { say('Check result: no reply in 10 seconds. This phone / network / browser cannot reach Firebase (firestore.googleapis.com). Try another network (Wi-Fi or another SIM), Safari instead of an in-app browser, and turn off VPN / ad-blocker / Private DNS.'); }, 10000);
    try {
      fetch('https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(c.projectId) + '/databases/(default)/documents/_diag?key=' + encodeURIComponent(c.apiKey))
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { s: r.status, j: j }; }); })
        .then(function (x) {
          clearTimeout(tm); var m = (x.j && x.j.error && x.j.error.message) || '';
          if (x.s === 403 && /has not been used|disabled/i.test(m)) say('Check result: the Cloud Firestore API is disabled for this project. Open Firebase > Build > Firestore Database and create / enable the database. [' + m.slice(0, 120) + ']');
          else if (x.s === 403 || x.s === 401) say('Check result: Firebase is reachable and the database exists ✓ (status ' + x.s + '). So the problem is the connection method or the rules, not the project.');
          else if (x.s === 404) say('Check result: Firestore database "(default)" was NOT found in project ' + c.projectId + '. Create it: Firebase > Build > Firestore Database > Create database. [' + m.slice(0, 120) + ']');
          else if (x.s === 400) say('Check result: API key / project id in config.js looks wrong (status 400). ' + m.slice(0, 140));
          else say('Check result: status ' + x.s + ' ' + m.slice(0, 140));
        })
        .catch(function (e) { clearTimeout(tm); say('Check result: this phone could not reach Firebase at all (' + ((e && e.message) || 'network error') + '). Try another network or browser; turn off VPN / ad-blocker / Private DNS.'); });
    } catch (e) { clearTimeout(tm); say('Check could not run.'); }
  }
  function cloudFail(code) {
    WR.err = code; showErr({ code: code }); render();
    var why = code === 'timeout' ? 'Firebase did not answer in 12 seconds. Check that the Firestore database is created (Firebase > Build > Firestore Database) and that the internet works.' : 'Firebase rejected the test save [' + code + '].';
    if (!OWNER) { openSheet('<h2>Cloud save blocked</h2><p>' + esc(why) + '</p><p id="probe" class="muted sm">Checking connection…</p><p>Tell the owner. The owner should open Staff, edit your name, and create your login again (Login on phone). Then log out and log in again here.</p><button class="btn block" data-act="close">Close</button>'); probeFirestore(); return; }
    openSheet('<h2>Cloud save is not working</h2><p>' + esc(why) + '</p><p id="probe"><b>Checking connection…</b></p><p><b>Fix (once):</b><br>1. Firebase Console > Firestore Database > <b>Rules</b> (called <b>Security</b> on phone).<br>2. Delete everything there, paste the text below. (Do this only if the check result above says the project is reachable.)<br>3. Tap <b>Publish</b>.<br>4. Come back here and tap Refresh.</p><textarea id="rulesBox" readonly style="width:100%;height:200px;font:12px/1.4 monospace;border:1px solid #888;border-radius:8px;padding:8px;box-sizing:border-box"></textarea><div class="two" style="margin-top:8px"><button class="btn primary" id="rulesCopy" type="button">Copy rules</button><button class="btn" data-act="close">Close</button></div>');
    var tb = document.getElementById('rulesBox'); if (tb) tb.value = rulesText();
    probeFirestore();
    var cb = document.getElementById('rulesCopy');
    if (cb) cb.onclick = function () {
      var t = document.getElementById('rulesBox'); t.focus(); t.select(); try { t.setSelectionRange(0, 99999); } catch (e) { /* ignore */ }
      var ok = function () { toast('Rules copied ✓'); };
      try { navigator.clipboard.writeText(t.value).then(ok, function () { try { document.execCommand('copy'); ok(); } catch (e2) { /* selected */ } }); } catch (e) { try { document.execCommand('copy'); ok(); } catch (e3) { /* selected */ } }
    };
  }
  function cloudCheck(user) {
    var done = false, tm = setTimeout(function () { if (!done && navigator.onLine !== false) cloudFail('timeout'); }, 12000);
    FS.collection('_diag').doc(user.uid).set({ t: Date.now(), by: user.email || '' })
      .then(function () { done = true; clearTimeout(tm); WR.err = ''; hideErr(); toast('Cloud connection OK ✓'); render(); })
      .catch(function (e) { done = true; clearTimeout(tm); cloudFail((e && e.code) || 'unknown'); });
  }
  (function boot() {
    var cfg = window.THANIMA_CONFIG || {};
    try { var sv = JSON.parse(localStorage.getItem('thanima-cfg') || 'null'); if ((!cfg.firebase || String(cfg.firebase.apiKey).indexOf('PASTE') === 0) && sv && sv.firebase) cfg = sv; } catch (e) { /* ignore */ }
    window.THANIMA_CONFIG = cfg;
    var login = document.getElementById('login'), form = document.getElementById('loginForm'),
      msg = document.getElementById('loginMsg'), err = document.getElementById('lg_err');
    var block = function (text) { msg.textContent = text; form.querySelectorAll('input,button').forEach(function (x) { x.hidden = true; }); login.hidden = false; };
    if (typeof firebase === 'undefined') return block('Internet is needed the first time you open. Turn on internet and open again.');
    if (!cfg.firebase || !cfg.firebase.apiKey || String(cfg.firebase.apiKey).indexOf('PASTE') === 0) {
      var sf = document.getElementById('setupForm'), se = document.getElementById('su_err');
      form.hidden = true; sf.hidden = false; login.hidden = false;
      sf.addEventListener('submit', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        var txt = document.getElementById('su_cfg').value, g = function (k) { var m = new RegExp(k + '\\s*[:=]\\s*["\']([^"\']+)["\']').exec(txt); return m ? m[1] : ''; };
        var fbc = { apiKey: g('apiKey'), authDomain: g('authDomain'), projectId: g('projectId'), storageBucket: g('storageBucket'), messagingSenderId: g('messagingSenderId'), appId: g('appId') };
        var owner = document.getElementById('su_owner').value.trim().toLowerCase();
        if (!fbc.apiKey || !fbc.projectId || !fbc.appId) { se.textContent = 'firebaseConfig Not pasted correctly (apiKey, projectId, appId are needed).'; return; }
        if (!owner) { se.textContent = 'Enter the owner’s login ID.'; return; }
        try { localStorage.setItem('thanima-cfg', JSON.stringify({ ownerEmail: owner.indexOf('@') >= 0 ? owner : owner + '@' + ((cfg.loginDomain) || 'thanima.app'), loginDomain: cfg.loginDomain || 'thanima.app', firebase: fbc })); location.reload(); } catch (e) { se.textContent = 'Could not save in this browser.'; }
      });
      return;
    }
    if (cfg.loginDomain) LOGIN_DOMAIN = String(cfg.loginDomain).toLowerCase();
    firebase.initializeApp(cfg.firebase);
    var auth = firebase.auth(), fs = firebase.firestore(); FS = fs;
    try { fs.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED, experimentalForceLongPolling: true }); } catch (e) { /* ignore */ }
    var ready = fs.enablePersistence({ synchronizeTabs: true }).catch(function () { /* ignore */ });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      var b = document.getElementById('lg_btn'); b.disabled = true; err.textContent = '';
      var idv = document.getElementById('lg_email').value.trim();
      if (!idv) { err.textContent = 'Enter the login ID.'; b.disabled = false; return; }
      auth.signInWithEmailAndPassword(toEmail(idv), document.getElementById('lg_pw').value)
        .catch(function (e) { err.textContent = authMsg(e); })
        .then(function () { b.disabled = false; });
    });
    auth.onAuthStateChanged(function (user) {
      UNSUBS.forEach(function (u) { try { u(); } catch (e) { /* ignore */ } }); UNSUBS = [];
      if (!user) { db = null; S.loaded = false; S.user = ''; S.mode = 'loading'; COLS.forEach(function (c) { S[c] = []; }); login.hidden = false; render(); return; }
      ready.then(function () {
        OWNER = !!cfg.ownerEmail && String(user.email || '').toLowerCase() === toEmail(cfg.ownerEmail);
        SUBCOLS = OWNER ? COLS : COLS.filter(function (c) { return c !== 'payouts' && c !== 'staffpay' && c !== 'team'; });
        S.user = user.email || ''; S.mode = 'cloud'; S.loaded = false; S.note = '';
        db = fbAdapter(fs); login.hidden = true; render(); subscribe(); cloudCheck(user);
      });
    });
  })();
})();
